# Canonical redirects for BoostYourLife.coach.
# Install these server blocks before the main HTTPS app block, then reload nginx.
#
# Canonical host: https://boostyourlife.coach
# Static root used by deploy.sh: /var/www/byl-dist

server {
    listen 80;
    listen [::]:80;
    server_name boostyourlife.coach www.boostyourlife.coach;

    return 301 https://boostyourlife.coach$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.boostyourlife.coach;

    # Keep these certificate paths aligned with the active nginx SSL config.
    ssl_certificate /etc/letsencrypt/live/boostyourlife.coach/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boostyourlife.coach/privkey.pem;

    return 301 https://boostyourlife.coach$request_uri;
}

